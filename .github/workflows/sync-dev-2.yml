name: Sync dev v2
on: workflow_dispatch
permissions:
  contents: write
  packages: read
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Merge official dev
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          printf '%s\n' 'patches/src/main/resources/addresources/values/youtube/strings.xml merge=union' 'patches/src/main/resources/addresources/values-tr-rTR/youtube/strings.xml merge=union' 'patches/src/main/kotlin/app/morphe/patches/youtube/layout/hide/general/HideLayoutComponentsPatch.kt merge=union' >> .git/info/attributes
          git fetch https://github.com/MorpheApp/morphe-patches.git dev
          git checkout -b official-dev-sync-2
          git merge --no-commit --no-ff FETCH_HEAD || true
          if [ -z "$(git rev-parse -q --verify MERGE_HEAD)" ]; then
            echo "Already up to date"
            exit 1
          fi
          git rm -rq --cached .github
          git checkout HEAD -- .github
          for f in CHANGELOG.md README.md patches-bundle.json patches-list.json; do
            if git diff --name-only --diff-filter=U | grep -qx "$f"; then
              git checkout --theirs -- "$f"
              git add "$f"
            fi
          done
          if git diff --name-only --diff-filter=U | grep -qx "gradle.properties"; then
            git checkout --ours -- gradle.properties
            git add gradle.properties
          fi
          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            echo "CONFLICT in these files, stopping:"
            echo "$LEFT"
            exit 1
          fi
          git commit -m "Merge official dev"
      - name: Test build
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Push branch
        run: git push origin official-dev-sync-2
